[project]
name = "epubhv"
version = "0.6.0"
description = "make your epub books vertical or horizontal."
authors = [{ name = "yihong0618", email = "zouzou0208@gmail.com" }]

dependencies = [
    "beautifulsoup4~=4.15",
    "cssutils~=2.15",
    "lxml~=6.1",
    "opencc-python-reimplemented~=0.1",
    "soupsieve~=2.8",
    "typed-argument-parser~=1.12",
    "jieba~=0.42",
    "pypinyin~=0.55",
    "unidic-lite~=1.0",
    "fugashi~=1.5",
    "langdetect~=1.0",
    "ToJyutping~=3.2",
]

requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/yihong0618/epubhv"

[project.scripts]
epubhv = "epubhv.cli:main"

[project.optional-dependencies]
web = [
    "streamlit~=1.59",
]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.build]
includes = ["epubhv"]

[tool.black]
target-version = ["py310"]

[tool.pdm.scripts]
format = "black ."
lint = "black . --check"
typing = "pyright"
test = "pytest -vv"
all = { composite = ["lint", "typing", "test"] }

[tool.pyright]
include = ["epubhv", "tests"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "src/experimental",
    "src/typestubs",
    "epubhv/yomituki.py"
]
defineConstant = { DEBUG = true }

reportMissingImports = true
reportMissingTypeStubs = false

[dependency-groups]
style = [
    "black~=26.5",
]
test = [
    "pytest~=9.1",
]
typing = [
    "pyright~=1.1",
    "types-beautifulsoup4~=4.12",
]
